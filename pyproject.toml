[project]
name = "camera-organizer"
version = "0.3.0"
description = "Toolkit for organizing photos/videos and converting camera footage (Log→Rec709 + share compression)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Ulises Chavarria" }]
dependencies = [
    "PySide6>=6.8.0",
    "Pillow>=11.0.0",
    "pillow-heif>=0.18.0",
    "exifread>=3.0.0",
    "numpy>=1.26.0",
    "appdirs>=1.4.4",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# Perceptual variant scoring for the Epson/TIFF converter.
ssim = ["scikit-image>=0.24.0"]

[project.scripts]
# GUI entry point (PySide6). Video-converter CLI stays module-invoked:
#   uv run python -m photo_organizer.video_converter.cli <folder> --run
camera-organizer = "photo_organizer.app:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_organizer"]

[tool.uv]
# uv manages an in-project .venv automatically on `uv sync`.
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ignore rules that fight intentional patterns in this codebase:
#   BLE001/S110/S112 — deliberate broad try/except around metadata & file I/O
#   DTZ00x           — local timestamps in report filenames are fine
#   PLW1510          — subprocess ffprobe calls check returncode manually
ignore = ["BLE001", "S110", "S112", "DTZ005", "DTZ006", "PLW1510", "RUF013"]
